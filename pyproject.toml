[build-system]
requires = ["scikit-build-core", "cmake", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "samay"
version = "0.1.0"
description = "Decentralized quant research for everyone"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = ["quant", "trading", "backtesting", "finance", "AI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "anthropic>=0.25.0",
    "mcp>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "alpaca-trade-api>=3.0.0",
    "kiteconnect>=5.0.0",
    "ib_insync>=0.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
cpp = [
    "scikit-build-core>=0.8.0",
    "cmake>=3.15",
    "pybind11>=2.6.0",
]

[tool.scikit-build]
cmake.minimum-version = "3.12"
cmake.build-type = "Release"

[project.scripts]
samay = "samay.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
