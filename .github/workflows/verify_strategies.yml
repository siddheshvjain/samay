name: Verify Strategies

on:
  pull_request:
    paths:
      - "strategies/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install samay
        run: pip install -e .

      - name: Find changed strategies
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- strategies/ | grep "strategy.py" || true)
          echo "strategies=$CHANGED" >> $GITHUB_OUTPUT

      - name: Verify each strategy
        if: steps.changed.outputs.strategies != ''
        run: |
          for strategy_file in ${{ steps.changed.outputs.strategies }}; do
            strategy_dir=$(dirname "$strategy_file")
            echo "Verifying $strategy_dir..."
            python -m pytest --doctest-modules "$strategy_file" || true
          done

      - name: Comment results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ Strategy verification complete. Check the logs above for details."
            })
